services:
  whatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ujjwalzb/whatbot:latest
    container_name: whatbot-app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:5000:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - WHATSAPP_SESSION_PATH=/usr/src/app/whatsapp-sessions
    volumes:
      - ./whatsapp-sessions:/usr/src/app/whatsapp-sessions
      - ./logs:/usr/src/app/logs
    mem_limit: 1g
