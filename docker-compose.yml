services:
  backend:
    build: .
    image: whatsapp-backend
    container_name: whatsapp-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: 
      - ./.env.production
    environment:
      WHATSAPP_SESSION_PATH: /usr/src/app/whatsapp-sessions
    volumes:
      - ./whatsapp-sessions:/usr/src/app/whatsapp-sessions
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 1g
    cpus: 1.5
